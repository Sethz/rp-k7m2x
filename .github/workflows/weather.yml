name: Wetter aktualisieren
on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:
  push:
    paths: ["stops.json", "scripts/fetch_weather.py"]
permissions:
  contents: write
concurrency: weather
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_weather.py
      - name: Speichern
        run: |
          git config user.name "wetter-bot"
          git config user.email "wetter-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || (git commit -m "Wetter aktualisiert" && git push)
